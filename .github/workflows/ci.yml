name: MERN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          set -euo pipefail
          touch backend/.env
          docker compose -p merndevopslab config --quiet

          # Fail if expected API services are missing from the rendered config
          cfg="$(docker compose -p merndevopslab config)"
          for svc in api1 api2 api3 mongo frontend nginx; do
            echo "$cfg" | grep -qE "^  ${svc}:" || {
              echo "ERROR: expected service '${svc}' not found in compose config"
              exit 1
            }
          done
          echo "Compose project merndevopslab and services validated"

      - name: Build Docker images
        run: |
          set -euo pipefail
          docker compose -p merndevopslab build
