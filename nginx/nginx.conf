server_tokens off;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'" always;

limit_req_zone $binary_remote_addr zone=my_limit_zone:10m rate=10r/s;

gzip on;
gzip_min_length 1000;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  application/x-javascript
  text/xml
  application/xml
  image/svg+xml
  application/xml+rss
  text/javascript;
gzip_comp_level 6;

# Cache path matches the compose bind mount ./nginx/cache -> /data/nginx/cache
# Used only for explicitly safe, non-user-specific endpoints below.
proxy_cache_path /data/nginx/cache
  levels=1:2
  keys_zone=my_cache:10m
  max_size=100m
  inactive=10m
  use_temp_path=off;

upstream backend_servers {
    least_conn;
    server api1:5000;
    server api2:5000;
    server api3:5000;
}

server {
    listen 80 default_server;
    server_name _;

    # Health only: safe to cache briefly (no user-specific data).
    location = /api/health {
        proxy_pass http://backend_servers/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache my_cache;
        proxy_cache_valid 200 30s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # All other API routes: never cache (todos and future auth responses).
    location /api/ {
        proxy_pass http://backend_servers/api/;
        limit_req zone=my_limit_zone burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
