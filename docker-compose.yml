name: merndevopslab

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  api1:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      API_NEW: api
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern-todos
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api2:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      API_NEW: api2
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern-todos
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api3:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      API_NEW: api3
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern-todos
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.merndevopslab.rule=Host(`merndevopslab.duckdns.org`)"
      - "traefik.http.routers.merndevopslab.entrypoints=websecure"
      - "traefik.http.routers.merndevopslab.tls=true"
      - "traefik.http.routers.merndevopslab.tls.certresolver=letsencrypt"
      - "traefik.http.services.merndevopslab.loadbalancer.server.port=80"
      - "traefik.docker.network=merndevopslab_default"
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/cache:/data/nginx/cache
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_data:
  nginx_cache:
